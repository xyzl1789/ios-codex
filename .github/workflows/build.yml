name: Build iOS Codex

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream Codex
        run: |
          git clone --depth 1 https://github.com/openai/codex.git upstream
          echo "COMMIT=$(cd upstream && git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          brew install dpkg

      - name: Patch for iOS
        run: bash scripts/patch-for-ios.sh

      - name: Build codex-rs
        run: |
          source "$HOME/.cargo/env"
          cd upstream/codex-rs
          cargo build -p codex-cli --release --target aarch64-apple-ios

      - name: Package rootless deb
        env:
          BIN: upstream/codex-rs/target/aarch64-apple-ios/release/codex
          VERSION: 1.${{ github.run_number }}-${{ env.COMMIT }}
        run: bash scripts/package-rootless.sh

      - name: Package roothide deb
        env:
          BIN: upstream/codex-rs/target/aarch64-apple-ios/release/codex
          VERSION: 1.${{ github.run_number }}-${{ env.COMMIT }}
        run: bash scripts/package-roothide.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-ios-debs
          path: dist/*.deb
          retention-days: 7
