name: Build iOS Codex

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream Codex
        run: |
          git clone --depth 1 https://github.com/openai/codex.git upstream
          echo "UPSTREAM_COMMIT=$(cd upstream && git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install Rust + iOS target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios

      - name: Install dpkg for deb packaging
        run: brew install dpkg

      - name: Apply iOS patches
        run: |
          cd upstream/codex-rs
          sed -i '' 's/arboard = { version = "3", features = \["wayland-data-control"\] }/arboard = { version = "3" }/' Cargo.toml
          sed -i '' 's/^lto = .*/lto = "off"/' Cargo.toml
          sed -i '' 's/^codegen-units = .*/codegen-units = 16/' Cargo.toml
          sed -i '' 's/target_os = "macos",/target_os = "macos",\'$'\n''    target_os = "ios",/' process-hardening/src/lib.rs
          printf '%s\n' '' '// iOS compat' '#[cfg(all(target_os = "ios", target_arch = "aarch64"))]' '#[unsafe(no_mangle)]' 'pub extern "C" fn __chkstk_darwin() {}' '' > /tmp/cs.rs
          sed -i '' '/^use tracing_subscriber::EnvFilter;$/r /tmp/cs.rs' cli/src/main.rs

      - name: Build codex-rs
        run: |
          source "$HOME/.cargo/env"
          cd upstream/codex-rs
          cargo build -p codex-cli --release --target aarch64-apple-ios 2>&1 | tail -50

      - name: Package rootless deb
        run: |
          SRC=upstream/codex-rs/target/aarch64-apple-ios/release/codex
          strip -x "$SRC" || true

          D=build/rootless
          mkdir -p "$D/var/jb/usr/local/lib/node_modules/@openai/codex/vendor/aarch64-apple-ios/codex"
          mkdir -p "$D/var/jb/usr/local/lib/node_modules/@openai/codex/vendor/aarch64-apple-ios/path"
          mkdir -p "$D/DEBIAN"

          cp "$SRC" "$D/var/jb/usr/local/lib/node_modules/@openai/codex/vendor/aarch64-apple-ios/codex/codex"

          V="1.${GITHUB_RUN_NUMBER:-0}-${UPSTREAM_COMMIT}"
          cat > "$D/DEBIAN/control" << EOC
          Package: com.openai.codex-ios
          Name: Codex CLI iOS Port
          Version: ${V}
          Architecture: iphoneos-arm64
          Maintainer: xyzl
          Author: xyzl
          Section: Development
          Priority: optional
          Depends: firmware (>= 14.0)
          Description: iOS arm64 port of OpenAI Codex CLI (rootless).
           Codex is a coding agent from OpenAI that runs locally.
           This is an iOS arm64 cross-compiled build for rootless jailbreaks.
          EOC

          cat > "$D/DEBIAN/postinst" << 'EOE'
          #!/bin/sh
          set -e
          P="${JB_ROOT:-/var/jb}"
          ldid -S "${P}/usr/local/lib/node_modules/@openai/codex/vendor/aarch64-apple-ios/codex/codex" 2>/dev/null || true
          echo "[ios-codex] rootless installed"
          EOE
          chmod 755 "$D/DEBIAN/postinst"

          mkdir -p dist
          dpkg-deb -b "$D" "dist/com.openai.codex-rootless_${V}_iphoneos-arm.deb"

      - name: Package roothide deb
        run: |
          SRC=upstream/codex-rs/target/aarch64-apple-ios/release/codex

          D=build/roothide
          mkdir -p "$D/var/jb/usr/local/lib/node_modules/@openai/codex/vendor/aarch64-apple-ios/codex"
          mkdir -p "$D/var/jb/usr/local/bin"
          mkdir -p "$D/DEBIAN"

          cp "$SRC" "$D/var/jb/usr/local/lib/node_modules/@openai/codex/vendor/aarch64-apple-ios/codex/codex"

          V="1.${GITHUB_RUN_NUMBER:-0}-${UPSTREAM_COMMIT}"
          cat > "$D/DEBIAN/control" << EOC
          Package: com.openai.codex-ios
          Name: Codex CLI iOS Port
          Version: ${V}
          Architecture: iphoneos-arm64e
          Maintainer: xyzl
          Author: xyzl
          Section: Development
          Priority: optional
          Depends: firmware (>= 14.0)
          Description: iOS arm64 port of OpenAI Codex CLI (roothide).
           Codex is a coding agent from OpenAI that runs locally.
           This is an iOS arm64 cross-compiled build for roothide jailbreaks.
          EOC

          dpkg-deb -b "$D" "dist/com.openai.codex-roothide_${V}_iphoneos-arm64e.deb"

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: codex-ios-debs
          path: dist/*.deb
          retention-days: 7
ENDOFWF
echo "ok"